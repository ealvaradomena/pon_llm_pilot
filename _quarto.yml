project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - reports/methods.qmd
    - reports/results.qmd
    - reports/model-comparison.qmd
    - reports/comparison-table.qmd
    - reports/berec.qmd
    - provenance/BEREC_REPLICATION.md
    - provenance/LEGACY_API_CALLS.md
    - provenance/RECONSTRUCTION.md
    - provenance/TABLE_A5_REPLICATION.md
  resources:
    - derived/figures/**

website:
  title: "PON Governance LLM Pilot"
  site-url: "https://ealvaradomena.github.io/pon_llm_pilot/"
  navbar:
    left:
      - href: index.qmd
        text: Overview
      - href: reports/methods.qmd
        text: Methods
      - href: reports/results.qmd
        text: 2024 Replication
      - href: reports/model-comparison.qmd
        text: SBS Model Comparison
      - href: reports/comparison-table.qmd
        text: Comparison Table
      - href: reports/berec.qmd
        text: BEREC
    right:
      - icon: github
        href: https://github.com/ealvaradomena/pon_llm_pilot
        aria-label: GitHub repository
  page-footer:
    center: "Computational materials for the PON governance LLM pilot"

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: false
    code-fold: true
    code-tools: true
    smooth-scroll: true
    theme: cosmo
