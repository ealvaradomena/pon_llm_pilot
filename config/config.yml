project:
  boundary_object_dir: input/boundary_objects
  questions_file: input/reference/questions.csv
  human_responses_file: input/reference/legacy_human_responses_confirmed.csv
  legacy_runs_file: input/reference/legacy_runs.csv
  current_output_dir: output/current
  improved_output_dir: output/improved
  berec_output_dir: output/berec_replication
  derived_dir: derived

# Historical request protocol recovered from the Dec. 24, 2024 project.
# The manuscript-facing condition appends the step-by-step clause.
legacy_protocol:
  endpoint: chat.completions
  model_alias: gpt-4-turbo
  temperature: null
  max_tokens: null
  top_p: null
  seed: null
  response_format: null
  starter: >-
    You are a policy analyst focused on extracting organizational features from documents that regulate the organization and functioning of specific organizations. I will provide the documents and a list of yes-no questions. You will only return TRUE or FALSE responses according to the list of yes-no questions, including a row with the question itself. The output must be in CSV format.
  techniques:
    zero_shot:
      suffix: ""
      code: z
    step_by_step:
      suffix: "Let's think step by step"
      code: sbs

# Archival/secondary improved protocol retained for provenance. It is not part of
# the revised principal SBS comparison.
improved_protocol:
  name: improved-v1
  endpoint: chat.completions
  # Operational cap applied equally to both improved-protocol model arms.
  max_output_tokens: 500
  # Observed GPT-4 Turbo TPM ceiling for this replication account.
  legacy_tpm_limit: 30000
  # Keep a conservative margin because local chat-token counts are estimates.
  preflight_headroom_tokens: 250
  starter: >-
    Use only the supplied document. For each question, answer TRUE only if the text explicitly supports it; otherwise FALSE. Do not infer unstated rules or use outside knowledge. Return exactly 15 rows as question_id,response, preceded by that header. No other text.

comparison:
  # BEREC remains in the archival entity registry below but is excluded from
  # the principal five-PON comparison and the default current-model runner.
  study_entities:
    - irg
    - euhc
    - coas
    - can
    - ceer
  # Historical 2024 calls recorded the moving alias gpt-4-turbo. The pinned
  # snapshot below is the best-supported dated GPT-4 Turbo reconstruction target.
  legacy_model: gpt-4-turbo-2024-04-09
  # Keep current_model for backward compatibility with the original contemporary
  # arm and the dedicated BEREC workflow. The principal five-PON comparison
  # evaluates every entry in comparison_models.
  current_model: gpt-5.4-nano-2026-03-17
  comparison_models:
    - model_id: gpt-5.4-nano-2026-03-17
      label: GPT-5.4 nano
      identifier_type: dated_snapshot
      snapshot_status: pinned_dated_snapshot
    - model_id: gpt-5.6-luna
      label: GPT-5.6 Luna
      identifier_type: undated_model_id
      snapshot_status: no_dated_snapshot_exposed
      openai_docs_checked_date: "2026-08-31"
      openai_model_docs: https://developers.openai.com/api/docs/models/gpt-5.6-luna
      provenance_note: >-
        OpenAI's GPT-5.6 Luna model page was checked on 2026-08-31. Its
        Snapshots section listed gpt-5.6-luna but no dated snapshot identifier.
        Preserve the request timestamp plus requested and returned model IDs for
        every run; do not describe gpt-5.6-luna as a dated or immutable snapshot.
  manuscript_excluded_question_id: 10
  mini_model: gpt-5.4-mini-2026-03-17

entities:
  - name: Body of European Regulators for Electronic Communications
    short_name: BEREC
    slug: berec
    boundary_object: BO1A.txt
    berec_replication_boundary_object: BO1B.txt
  - name: Independent Regulators Group
    short_name: IRG
    slug: irg
    boundary_object: BO2A.txt
  - name: EU Health Coalition
    short_name: EUHC
    slug: euhc
    boundary_object: BO3A.txt
  - name: cOAlition S
    short_name: COAS
    slug: coas
    boundary_object: BO4A.txt
  - name: Climate Action Network
    short_name: CAN
    slug: can
    boundary_object: BO5A.txt
  - name: Council of European Energy Regulators
    short_name: CEER
    slug: ceer
    boundary_object: BO6A.txt
